<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🥊 Pocket Boxing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0b1a2e, #1a2f44);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            margin: 0;
            padding: 12px;
        }

        .game-container {
            background: #1f3a4e;
            border-radius: 56px 56px 40px 40px;
            padding: 20px 16px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7), inset 0 0 0 2px #6f8fa0;
            transition: all 0.2s;
        }

        .canvas-wrapper {
            background: #132433;
            border-radius: 32px;
            padding: 8px;
            box-shadow: inset 0 0 12px #0b1a2a, 0 8px 0 #0b1a26;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 400 / 400;
            background: radial-gradient(circle at 20% 30%, #264b5e, #10212e);
            border-radius: 24px;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 4px 0 #0a1a24;
            image-rendering: crisp-edges;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 6px 10px 6px;
            color: #f2e9d0;
            text-shadow: 0 2px 0 #0b1a22;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .score-box {
            background: #0d202b;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 1.3rem;
            box-shadow: inset 0 2px 6px #0a141e, 0 3px 0 #09161f;
            border-bottom: 2px solid #4f7a8f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-box span {
            color: #f7d44a;
            font-size: 1.6rem;
            min-width: 2.8rem;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2b4d62;
            border: none;
            border-bottom: 6px solid #12303f;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #f2efe0;
            text-shadow: 0 2px 0 #0f2938;
            box-shadow: 0 6px 0 #0b202d, 0 8px 12px rgba(0,0,0,0.4);
            transition: all 0.08s ease;
            touch-action: manipulation;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1 1 auto;
            min-width: 110px;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translateY(5px);
            border-bottom-width: 2px;
            box-shadow: 0 2px 0 #0b202d;
        }

        .btn.reset-btn {
            background: #5f3e3e;
            border-bottom-color: #3d2626;
            box-shadow: 0 6px 0 #2d1b1b, 0 8px 12px rgba(0,0,0,0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            border-bottom-width: 2px;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .mobile-punch {
            background: #c7452b;
            border-bottom-color: #7f2c1a;
            box-shadow: 0 6px 0 #5f1f12, 0 8px 12px rgba(0,0,0,0.5);
            font-size: 1.7rem;
            padding: 14px 28px;
            min-width: 140px;
        }

        .footer-tip {
            color: #7d9db0;
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0.9;
            text-shadow: 0 1px 0 #0b1a22;
        }

        @media (max-width: 450px) {
            .game-container { padding: 12px 10px 20px; }
            .btn { font-size: 1.1rem; padding: 10px 14px; min-width: 80px; }
            .mobile-punch { font-size: 1.4rem; padding: 14px 16px; min-width: 110px; }
            .score-box { font-size: 1.0rem; padding: 6px 14px; }
            .score-box span { font-size: 1.4rem; min-width: 2.2rem; }
        }

        @media (pointer: coarse) {
            .btn { touch-action: manipulation; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="hud">
        <div class="score-box">🥊 <span id="scoreDisplay">0</span></div>
        <div class="score-box">⏱️ <span id="timerDisplay">30</span></div>
    </div>

    <div class="controls">
        <button class="btn" id="punchBtn" aria-label="Punch">👊 PUNCH</button>
        <button class="btn reset-btn" id="resetBtn">🔄 RESET</button>
    </div>
    <div class="controls">
        <button class="btn mobile-punch" id="bigPunchBtn" aria-label="Big punch">🥊 BIG PUNCH</button>
    </div>
    <div class="footer-tip">
        👆 Tap canvas or buttons · Punch the heavy bag!
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const timerSpan = document.getElementById('timerDisplay');

        // --- GAME STATE ---
        const state = {
            score: 0,
            timer: 30,          // seconds
            gameActive: false,
            gameOver: false,
            // heavy bag physics
            bagX: 200,          // center x
            bagY: 200,          // center y
            bagVX: 0,
            bagVY: 0,
            bagRestX: 200,
            bagRestY: 200,
            // punch effect
            punchFlash: 0,      // 0..1 intensity
            hitParticles: [],
            // timers
            timerInterval: null,
            animationFrame: null,
        };

        // --- DOM REFS ---
        const punchBtn = document.getElementById('punchBtn');
        const bigPunchBtn = document.getElementById('bigPunchBtn');
        const resetBtn = document.getElementById('resetBtn');

        // --- HELPER FUNCTIONS ---
        function stopGameLoop() {
            if (state.animationFrame) {
                cancelAnimationFrame(state.animationFrame);
                state.animationFrame = null;
            }
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function resetGame(keepTimer = false) {
            stopGameLoop();

            state.score = 0;
            state.bagX = 200;
            state.bagY = 200;
            state.bagVX = 0;
            state.bagVY = 0;
            state.punchFlash = 0;
            state.hitParticles = [];
            state.gameOver = false;
            state.gameActive = true;

            if (!keepTimer) {
                state.timer = 30;
            } else {
                // if reset while active, keep timer but we'll reset anyway
                state.timer = 30;
            }

            updateScoreDisplay();
            updateTimerDisplay();

            // enable buttons
            punchBtn.disabled = false;
            bigPunchBtn.disabled = false;

            // start game loop
            startGameLoop();
            startTimer();
        }

        function startGameLoop() {
            if (state.animationFrame) cancelAnimationFrame(state.animationFrame);
            function loop() {
                if (!state.gameActive && !state.gameOver) {
                    // if game not active but still loop? just draw
                }
                updatePhysics();
                render();
                state.animationFrame = requestAnimationFrame(loop);
            }
            state.animationFrame = requestAnimationFrame(loop);
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (!state.gameActive || state.gameOver) return;
                state.timer -= 1;
                updateTimerDisplay();

                if (state.timer <= 0) {
                    state.timer = 0;
                    updateTimerDisplay();
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            state.gameActive = false;
            state.gameOver = true;
            punchBtn.disabled = true;
            bigPunchBtn.disabled = true;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            // show game over effect
        }

        // --- PHYSICS & UPDATE ---
        function updatePhysics() {
            if (!state.gameActive && !state.gameOver) return;
            // bag physics: spring-like to rest position
            const k = 0.12;
            const damping = 0.88;

            const dx = state.bagX - state.bagRestX;
            const dy = state.bagY - state.bagRestY;

            const ax = -k * dx;
            const ay = -k * dy;

            state.bagVX += ax;
            state.bagVY += ay;

            state.bagVX *= damping;
            state.bagVY *= damping;

            state.bagX += state.bagVX;
            state.bagY += state.bagVY;

            // boundaries (soft)
            const margin = 40;
            if (state.bagX < margin) { state.bagX = margin; state.bagVX *= -0.3; }
            if (state.bagX > 400 - margin) { state.bagX = 400 - margin; state.bagVX *= -0.3; }
            if (state.bagY < margin) { state.bagY = margin; state.bagVY *= -0.3; }
            if (state.bagY > 400 - margin) { state.bagY = 400 - margin; state.bagVY *= -0.3; }

            // particles update
            for (let i = state.hitParticles.length - 1; i >= 0; i--) {
                const p = state.hitParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.life -= 0.025;
                if (p.life <= 0 || p.y > 420) {
                    state.hitParticles.splice(i, 1);
                }
            }

            // flash decay
            if (state.punchFlash > 0) {
                state.punchFlash *= 0.92;
                if (state.punchFlash < 0.01) state.punchFlash = 0;
            }
        }

        // --- RENDER ---
        function render() {
            ctx.clearRect(0, 0, 400, 400);

            // draw background ropes / ring
            ctx.save();
            ctx.strokeStyle = '#5c7f8f';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#0a1a26';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(200, 200, 120, 0, Math.PI * 2);
            ctx.strokeStyle = '#3b5f72';
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // inner ring
            ctx.beginPath();
            ctx.arc(200, 200, 100, 0, Math.PI * 2);
            ctx.strokeStyle = '#8fb4c9';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // heavy bag (with shadow)
            const bagX = state.bagX;
            const bagY = state.bagY;

            // shadow
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 6;

            // bag body (leather)
            const gradient = ctx.createRadialGradient(bagX-15, bagY-15, 8, bagX, bagY, 50);
            gradient.addColorStop(0, '#d94f3a');
            gradient.addColorStop(0.5, '#b13a2a');
            gradient.addColorStop(1, '#73261e');
            ctx.beginPath();
            ctx.ellipse(bagX, bagY, 36, 44, 0, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;
            ctx.strokeStyle = '#4f2a22';
            ctx.lineWidth = 3;
            ctx.stroke();

            // bag stripes
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#f5d742';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(bagX, bagY-8, 20, 12, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(bagX, bagY+12, 22, 10, 0, 0, Math.PI * 2);
            ctx.stroke();

            // brand "X"
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.fillStyle = '#f7eac6';
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 8;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⛓️', bagX, bagY-3);
            ctx.restore();

            // punch flash overlay (white glow)
            if (state.punchFlash > 0.02) {
                ctx.save();
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255,240,180,0.8)';
                ctx.beginPath();
                ctx.arc(bagX, bagY, 40 + 20 * state.punchFlash, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 220, 120, ${state.punchFlash * 0.3})`;
                ctx.fill();
                ctx.restore();
            }

            // particles (sparks)
            for (const p of state.hitParticles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 70, ${p.life})`;
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#ffb347';
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.restore();

            // game over overlay
            if (state.gameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(10, 20, 30, 0.7)';
                ctx.fillRect(0, 0, 400, 400);
                ctx.font = 'bold 38px "Segoe UI", sans-serif';
                ctx.fillStyle = '#f5d742';
                ctx.shadowColor = '#0b1a26';
                ctx.shadowBlur = 16;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏰ GAME OVER', 200, 180);
                ctx.font = '24px sans-serif';
                ctx.fillStyle = '#e6dcc0';
                ctx.fillText('score: ' + state.score, 200, 260);
                ctx.restore();
            }

            // draw timer warning if low
            if (state.timer <= 5 && state.timer > 0 && state.gameActive) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 80, 60, ${0.2 + 0.2 * Math.sin(Date.now() / 200)})`;
                ctx.fillRect(0, 0, 400, 400);
                ctx.restore();
            }
        }

        // --- PUNCH LOGIC ---
        function performPunch(power = 1.0) {
            if (!state.gameActive || state.gameOver) return;

            // random offset for "hit" feel
            const hitForce = 6 + power * 8;
            const angle = (Math.random() - 0.5) * 0.6;
            const forceX = Math.cos(angle) * hitForce * (0.9 + 0.2 * Math.random());
            const forceY = Math.sin(angle) * hitForce * 0.5 + (Math.random() - 0.5) * 1.2;

            state.bagVX += forceX;
            state.bagVY += forceY - 0.8;

            // Flash
            state.punchFlash = 0.5 + power * 0.3;

            // Particles (sparks)
            const count = 12 + Math.floor(power * 10);
            for (let i = 0; i < count; i++) {
                const angleP = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 5 * power;
                state.hitParticles.push({
                    x: state.bagX + (Math.random() - 0.5) * 28,
                    y: state.bagY + (Math.random() - 0.5) * 28,
                    vx: Math.cos(angleP) * speed * (0.4 + 0.6 * Math.random()),
                    vy: Math.sin(angleP) * speed * (0.4 + 0.6 * Math.random()) - 1.2,
                    size: 4 + Math.random() * 8,
                    life: 0.8 + Math.random() * 0.6,
                });
            }

            // Score
            const points = Math.floor(5 + power * 8 + Math.random() * 6);
            state.score += points;
            updateScoreDisplay();

            // slight screen shake effect via flash
        }

        // --- UI UPDATES ---
        function updateScoreDisplay() {
            scoreSpan.innerText = state.score;
        }
        function updateTimerDisplay() {
            timerSpan.innerText = Math.max(0, state.timer);
        }

        // --- EVENT LISTENERS ---
        function handlePunch(e) {
            e.preventDefault();
            performPunch(1.0);
        }

        function handleBigPunch(e) {
            e.preventDefault();
            performPunch(1.9);
        }

        function handleCanvasPunch(e) {
            e.preventDefault();
            performPunch(0.9); // tap on bag
        }

        function handleReset(e) {
            e.preventDefault();
            stopGameLoop();
            resetGame(false);
        }

        // --- BIND EVENTS ---
        punchBtn.addEventListener('click', handlePunch);
        punchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handlePunch(e); }, { passive: false });

        bigPunchBtn.addEventListener('click', handleBigPunch);
        bigPunchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleBigPunch(e); }, { passive: false });

        resetBtn.addEventListener('click', handleReset);
        resetBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleReset(e); }, { passive: false });

        canvas.addEventListener('click', handleCanvasPunch);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleCanvasPunch(e);
        }, { passive: false });

        // prevent context menu on long press
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- INIT ---
        function init() {
            stopGameLoop();
            resetGame(false);
        }

        init();

        // Handle visibility change to keep timer stable
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // pause? we keep running but no extra action
            } else {
                // if game over, show
                render();
            }
        });

        // ensure mobile viewport
        window.addEventListener('resize', () => {});
        console.log('🥊 Pocket Boxing ready!');
    })();
</script>
</body>
</html>
