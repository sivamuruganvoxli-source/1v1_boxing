<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🥊 100 Level Boxing</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      padding: 12px;
    }
    .game-wrapper {
      background: #1e3b4f;
      padding: 18px 18px 24px;
      border-radius: 56px 56px 32px 32px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.08);
      max-width: 500px;
      width: 100%;
      transition: all 0.2s;
    }
    .canvas-container {
      background: #0f212f;
      border-radius: 40px 40px 24px 24px;
      padding: 10px;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.5);
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 400 / 480;
      background: radial-gradient(circle at 20% 30%, #3a6b85, #1d3e52);
      border-radius: 32px;
      box-shadow: 0 0 0 2px #3f6b80, 0 0 0 4px #1c3342;
      touch-action: none;
      cursor: pointer;
      margin: 0 auto;
    }
    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 12px 6px 12px;
      color: #edf4f7;
      text-shadow: 0 2px 3px #0a141e;
      font-weight: 600;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    .level-box {
      background: #132a38;
      padding: 8px 20px;
      border-radius: 60px;
      box-shadow: inset 0 3px 6px #0b1c26, 0 4px 6px rgba(0,0,0,0.5);
      font-size: 1.4rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-box span {
      background: #f5c542;
      color: #1d2f3b;
      padding: 0 14px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 1.9rem;
      line-height: 1.4;
      min-width: 48px;
      text-align: center;
      box-shadow: inset 0 -2px 0 #a07d2c;
    }
    .status-badge {
      background: #1e3d4e;
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 2px 5px #0e202b;
      border-bottom: 2px solid #3b6a7a;
    }
    .status-badge .emoji {
      font-size: 1.7rem;
      line-height: 1;
    }
    .reset-btn {
      background: #b13e3e;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 8px 20px;
      border-radius: 40px;
      box-shadow: 0 6px 0 #681f1f, 0 4px 12px black;
      transition: 0.08s linear;
      touch-action: manipulation;
      cursor: pointer;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #d97a7a;
    }
    .reset-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #681f1f;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 12px;
      padding: 0 6px;
    }
    .punch-btn {
      background: #d93f3f;
      border: none;
      border-radius: 80px;
      padding: 14px 30px;
      font-weight: 800;
      font-size: 1.5rem;
      color: white;
      text-shadow: 0 2px 0 #691f1f;
      box-shadow: 0 9px 0 #6f2424, 0 6px 16px rgba(0,0,0,0.5);
      transition: 0.06s linear;
      touch-action: manipulation;
      cursor: pointer;
      flex: 1;
      max-width: 180px;
      border: 1px solid #f06a6a;
      letter-spacing: 2px;
    }
    .punch-btn:active {
      transform: translateY(7px);
      box-shadow: 0 2px 0 #6f2424;
    }
    .punch-btn:disabled {
      opacity: 0.6;
      transform: translateY(5px);
      box-shadow: 0 4px 0 #6f2424;
      pointer-events: none;
    }
    .footer-note {
      text-align: center;
      color: #7b9eb0;
      font-size: 0.75rem;
      margin-top: 14px;
      letter-spacing: 0.3px;
      opacity: 0.8;
    }
    @media (max-width: 460px) {
      .game-wrapper { padding: 10px; }
      .level-box { font-size: 1.1rem; padding: 4px 14px; }
      .level-box span { font-size: 1.6rem; min-width: 40px; }
      .status-badge { font-size: 1rem; padding: 4px 12px; }
      .punch-btn { font-size: 1.3rem; padding: 16px 12px; }
      .reset-btn { font-size: 0.9rem; padding: 6px 14px; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="canvas-container">
    <canvas id="boxingCanvas" width="400" height="480"></canvas>
  </div>

  <div class="info-panel">
    <div class="level-box">
      🥊 <span id="levelDisplay">1</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="emoji">👊</span> <span id="statusText">Ready</span>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ Reset</button>
  </div>

  <div class="controls">
    <button class="punch-btn" id="punchBtn">👊 PUNCH</button>
  </div>
  <div class="footer-note">▼ tap punch or press SPACE · 100 levels</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('boxingCanvas');
    const ctx = canvas.getContext('2d');
    const levelSpan = document.getElementById('levelDisplay');
    const statusText = document.getElementById('statusText');
    const statusEmoji = document.querySelector('.status-badge .emoji');
    const punchBtn = document.getElementById('punchBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ----- GAME STATE -----
    const state = {
      level: 1,
      // opponent
      opponentX: 270,        // fixed x (right side)
      opponentY: 220,        // base y
      opponentRadius: 38,
      opponentSpeed: 1.8,    // will scale with level
      opponentDirection: 1,  // 1 = down, -1 = up
      // player
      playerX: 120,
      playerY: 240,
      playerRadius: 32,
      // punch
      isPunching: false,
      punchTimer: 0,
      punchCooldown: 0,
      // hit & block
      hitCount: 0,
      blockCount: 0,        // consecutive blocks (for difficulty)
      isHitCooldown: false,
      hitCooldownTimer: 0,
      // game status
      gameOver: false,
      win: false,
      // animation
      animFrame: null,
    };

    // ----- CONSTANTS -----
    const MAX_LEVEL = 100;
    const BASE_SPEED = 1.8;
    const PUNCH_DURATION = 12;      // frames
    const PUNCH_COOLDOWN_MAX = 18;  // frames
    const HIT_COOLDOWN_MAX = 25;    // frames (invincibility after hit)

    // ----- HELPER FUNCTIONS -----
    function getLevelSpeed(level) {
      // difficulty scales: speed + extra aggression, but capped so it's still playable
      return Math.min(BASE_SPEED + (level - 1) * 0.26, 6.5);
    }

    function getOpponentRadius(level) {
      // slightly bigger opponents at higher levels? but keep reasonable
      return Math.min(38 + Math.floor(level / 25), 46);
    }

    // reset match (keeps level)
    function resetMatch() {
      state.opponentY = 220;
      state.opponentDirection = 1;
      state.isPunching = false;
      state.punchTimer = 0;
      state.punchCooldown = 0;
      state.hitCount = 0;
      state.blockCount = 0;
      state.isHitCooldown = false;
      state.hitCooldownTimer = 0;
      state.gameOver = false;
      state.win = false;
      state.opponentSpeed = getLevelSpeed(state.level);
      state.opponentRadius = getOpponentRadius(state.level);
      // update ui
      updateStatusText('Ready', '👊');
      punchBtn.disabled = false;
      levelSpan.textContent = state.level;
    }

    // next level
    function goToNextLevel() {
      if (state.level >= MAX_LEVEL) {
        // you win the game!
        state.gameOver = true;
        state.win = true;
        updateStatusText('🏆 CHAMPION!', '🏆');
        punchBtn.disabled = true;
        return;
      }
      state.level += 1;
      state.opponentSpeed = getLevelSpeed(state.level);
      state.opponentRadius = getOpponentRadius(state.level);
      resetMatch(); // resets positions & cooldowns
      levelSpan.textContent = state.level;
      // extra UI feedback
      updateStatusText(`Level ${state.level}`, '⚡');
    }

    // Player punches
    function performPunch() {
      if (state.gameOver) return;
      if (state.isPunching) return;
      if (state.punchCooldown > 0) return;
      if (state.isHitCooldown) return; // can't punch while hit stun

      // initiate punch
      state.isPunching = true;
      state.punchTimer = PUNCH_DURATION;
      state.punchCooldown = PUNCH_COOLDOWN_MAX;
      punchBtn.disabled = true; // will be re-enabled after punch

      // check if opponent is in range (collision detection)
      const dx = state.opponentX - state.playerX;
      const dy = state.opponentY - state.playerY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const hitThreshold = state.playerRadius + state.opponentRadius - 6; // slight forgiveness

      if (dist < hitThreshold) {
        // HIT!
        state.hitCount++;
        state.blockCount = 0; // reset block streak

        // increase difficulty by making opponent faster if they get hit (but cap)
        state.opponentSpeed = Math.min(state.opponentSpeed + 0.25, 7.2);

        // if hit count reaches 3 → level up!
        if (state.hitCount >= 3) {
          goToNextLevel();
          return; // level up resets everything
        } else {
          // opponent flashes / gets pushed back
          state.opponentY += 20 * state.opponentDirection; // small push
          // update status
          updateStatusText(`👊 Hit ${state.hitCount}/3`, '💥');
          // small cooldown for opponent (prevent immediate hit)
          state.isHitCooldown = true;
          state.hitCooldownTimer = HIT_COOLDOWN_MAX;
        }
      } else {
        // miss
        state.blockCount++;
        updateStatusText('Miss!', '😤');
        // if too many misses, opponent gets faster (punish)
        if (state.blockCount >= 4) {
          state.opponentSpeed = Math.min(state.opponentSpeed + 0.3, 7.0);
          state.blockCount = 0;
          updateStatusText('Speed up!', '🔥');
        }
      }
    }

    // UI update
    function updateStatusText(text, emoji = '👊') {
      statusText.textContent = text;
      statusEmoji.textContent = emoji || '👊';
    }

    // ----- UPDATE LOOP (called each frame) -----
    function updateGame() {
      if (state.gameOver) {
        // keep drawing, no updates
        return;
      }

      // cooldown timers
      if (state.punchCooldown > 0) {
        state.punchCooldown--;
        if (state.punchCooldown === 0) {
          punchBtn.disabled = false;
        }
      }

      if (state.isHitCooldown) {
        state.hitCooldownTimer--;
        if (state.hitCooldownTimer <= 0) {
          state.isHitCooldown = false;
        }
      }

      // punch timer
      if (state.isPunching) {
        state.punchTimer--;
        if (state.punchTimer <= 0) {
          state.isPunching = false;
          // re-enable button if cooldown already 0
          if (state.punchCooldown === 0) {
            punchBtn.disabled = false;
          }
        }
      }

      // ----- OPPONENT AI movement -----
      // only move if not game over and not hit cooldown (stunned)
      if (!state.isHitCooldown) {
        // move up/down
        state.opponentY += state.opponentSpeed * state.opponentDirection * 0.6;

        // boundaries (with padding)
        const minY = 80;
        const maxY = 380;
        if (state.opponentY < minY) {
          state.opponentY = minY;
          state.opponentDirection = 1;
        } else if (state.opponentY > maxY) {
          state.opponentY = maxY;
          state.opponentDirection = -1;
        }

        // random direction change (adds unpredictability) higher level = more changes
        if (Math.random() < 0.008 + (state.level * 0.0006)) {
          state.opponentDirection *= -1;
        }
      }

      // If opponent hits player (collision) → lose condition (only if not in hit cooldown)
      if (!state.isHitCooldown && !state.gameOver) {
        const dx = state.opponentX - state.playerX;
        const dy = state.opponentY - state.playerY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const threshold = state.playerRadius + state.opponentRadius - 8;
        if (dist < threshold) {
          // opponent lands a hit → game over (loss)
          state.gameOver = true;
          state.win = false;
          updateStatusText('💀 KO!', '💀');
          punchBtn.disabled = true;
        }
      }

      // if win condition (level 100 completed) already handled in goToNextLevel
    }

    // ----- DRAWING -----
    function draw() {
      ctx.clearRect(0, 0, 400, 480);

      // ---- ring decorations ----
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 12;

      // player (left)
      ctx.beginPath();
      ctx.arc(state.playerX, state.playerY, state.playerRadius, 0, Math.PI*2);
      ctx.fillStyle = '#2d7eb0';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.strokeStyle = '#b4d9f0';
      ctx.lineWidth = 3;
      ctx.stroke();
      // face
      ctx.beginPath();
      ctx.arc(state.playerX-8, state.playerY-6, 6, 0, Math.PI*2);
      ctx.fillStyle = '#f5e6d3';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(state.playerX+8, state.playerY-6, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#1f1f2e';
      ctx.beginPath();
      ctx.arc(state.playerX-10, state.playerY-10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(state.playerX+6, state.playerY-10, 3, 0, Math.PI*2);
      ctx.fill();

      // opponent (right)
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(state.opponentX, state.opponentY, state.opponentRadius, 0, Math.PI*2);
      ctx.fillStyle = '#b83b3b';
      ctx.fill();
      ctx.strokeStyle = '#e07a7a';
      ctx.lineWidth = 3;
      ctx.stroke();

      // opponent face
      ctx.beginPath();
      ctx.arc(state.opponentX-8, state.opponentY-6, 7, 0, Math.PI*2);
      ctx.fillStyle = '#d9b8a0';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(state.opponentX+8, state.opponentY-6, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#1f1f2e';
      ctx.beginPath();
      ctx.arc(state.opponentX-10, state.opponentY-10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(state.opponentX+6, state.opponentY-10, 3, 0, Math.PI*2);
      ctx.fill();

      // ---- punch effect ----
      if (state.isPunching) {
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(state.playerX + 40, state.playerY - 2, 18, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255, 220, 80, 0.6)';
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 180, 40, 0.8)';
        ctx.beginPath();
        ctx.arc(state.playerX + 48, state.playerY - 4, 12, 0, Math.PI*2);
        ctx.fill();
      }

      // hit cooldown indicator (on opponent)
      if (state.isHitCooldown) {
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(state.opponentX, state.opponentY, state.opponentRadius+6, 0, Math.PI*2);
        ctx.strokeStyle = '#ffdd44';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // game over overlay
      if (state.gameOver) {
        ctx.shadowBlur = 20;
        ctx.font = 'bold 38px "Segoe UI", system-ui';
        ctx.fillStyle = state.win ? '#f5d742' : '#e05858';
        ctx.shadowColor = 'black';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.win ? '🏆 WINNER' : '💀 LOST', 200, 80);
        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = '#ebf5f0';
        ctx.fillText(state.win ? 'You are the champion!' : 'Press Reset', 200, 140);
      }

      // level display on canvas
      ctx.shadowBlur = 10;
      ctx.font = 'bold 18px monospace';
      ctx.fillStyle = '#dbeef5';
      ctx.textAlign = 'left';
      ctx.fillText(`Lv.${state.level}`, 16, 40);
      ctx.fillStyle = '#b3d6e0';
      ctx.fillText(`❤️ ${3 - state.hitCount} hits left`, 16, 68);

      ctx.shadowBlur = 0;
    }

    // ----- ANIMATION LOOP -----
    function gameLoop() {
      updateGame();
      draw();
      state.animFrame = requestAnimationFrame(gameLoop);
    }

    // ----- RESET (full) -----
    function fullReset() {
      // reset level to 1
      state.level = 1;
      state.opponentSpeed = getLevelSpeed(1);
      state.opponentRadius = getOpponentRadius(1);
      resetMatch();
      levelSpan.textContent = 1;
      updateStatusText('Reset', '🔄');
      punchBtn.disabled = false;
      // clear any game over
      state.gameOver = false;
      state.win = false;
    }

    // ----- EVENT LISTENERS -----
    punchBtn.addEventListener('click', (e) => {
      e.preventDefault();
      performPunch();
    });

    // keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        performPunch();
      }
    });

    resetBtn.addEventListener('click', (e) => {
      e.preventDefault();
      fullReset();
    });

    // Prevent context menu on long press (mobile)
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // touch support for canvas (punch on tap)
    canvas.addEventListener('click', (e) => {
      e.preventDefault();
      performPunch();
    });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      performPunch();
    }, { passive: false });

    // ----- INIT -----
    function init() {
      state.opponentSpeed = getLevelSpeed(1);
      state.opponentRadius = getOpponentRadius(1);
      resetMatch();
      levelSpan.textContent = 1;
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      gameLoop();
    }

    init();
  })();
</script>
</body>
</html>
