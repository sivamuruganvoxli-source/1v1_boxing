<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>1v1 Boxing - Multiplayer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #game-wrapper {
    width: 100%;
    max-width: 900px;
    padding: 12px;
  }
  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 8px;
    gap: 16px;
  }
  .health-box { flex: 1; }
  .health-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: 600;
  }
  .health-label span:last-child { opacity: 0.8; }
  .bar-track {
    width: 100%;
    height: 14px;
    background: #21262d;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #30363d;
  }
  .bar-fill {
    height: 100%;
    border-radius: 7px;
    transition: width 0.15s ease, background 0.3s;
  }
  .timer-box {
    text-align: center;
    min-width: 90px;
  }
  .timer-box .time {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer-box .round {
    font-size: 12px;
    color: #8b949e;
    margin-top: 2px;
  }
  #status {
    text-align: center;
    padding: 10px;
    font-size: 18px;
    font-weight: 600;
    min-height: 40px;
    color: #f0883e;
  }
  .controls-info {
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #8b949e;
    line-height: 1.6;
  }
  .controls-info strong { color: #c9d1d9; }
  .mobile-pad {
    display: none;
    margin-top: 10px;
  }
  .pad-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 6px;
  }
  .pad-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .dpad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px;
    gap: 4px;
  }
  .dpad .btn:nth-child(1) { grid-column: 2; grid-row: 1; }
  .dpad .btn:nth-child(2) { grid-column: 1; grid-row: 2; }
  .dpad .btn:nth-child(3) { grid-column: 2; grid-row: 2; }
  .dpad .btn:nth-child(4) { grid-column: 3; grid-row: 2; }
  .btn {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    transition: transform 0.05s, background 0.1s;
  }
  .btn:active, .btn.pressed {
    transform: scale(0.92);
    background: #30363d;
  }
  .action-btn {
    width: 130px;
    height: 52px;
    border-radius: 14px;
    border: 1px solid #30363d;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    touch-action: manipulation;
    user-select: none;
    cursor: pointer;
    transition: transform 0.05s;
    margin-top: 4px;
  }
  .action-btn:active, .action-btn.pressed { transform: scale(0.92); }
  .p1-action { background: #da3633; }
  .p2-action { background: #1f6feb; }
  .reset-row {
    text-align: center;
    padding: 12px;
  }
  .reset-btn {
    padding: 12px 32px;
    border-radius: 12px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .reset-btn:hover { background: #30363d; }
  @media (max-width: 640px) {
    .mobile-pad { display: block; }
    .controls-info { display: none; }
    .hud { padding: 10px 4px; gap: 10px; }
    .timer-box .time { font-size: 26px; }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="health-box">
      <div class="health-label">
        <span style="color:#f85149;">Player 1</span>
        <span id="p1hp">100%</span>
      </div>
      <div class="bar-track">
        <div id="p1bar" class="bar-fill" style="width:100%;background:#3fb950;"></div>
      </div>
    </div>
    <div class="timer-box">
      <div class="time" id="timer">60</div>
      <div class="round">Round 1</div>
    </div>
    <div class="health-box">
      <div class="health-label">
        <span id="p2hp">100%</span>
        <span style="color:#58a6ff;">Player 2</span>
      </div>
      <div class="bar-track">
        <div id="p2bar" class="bar-fill" style="width:100%;background:#3fb950;"></div>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <div class="controls-info">
    <strong style="color:#f85149;">P1:</strong> A/D Move &nbsp;|&nbsp; W Jump/Block &nbsp;|&nbsp; S Duck &nbsp;|&nbsp; Space Punch
    &nbsp;&nbsp;&nbsp;&nbsp;
    <strong style="color:#58a6ff;">P2:</strong> Arrows Move &nbsp;|&nbsp; Up Jump/Block &nbsp;|&nbsp; Down Duck &nbsp;|&nbsp; Enter Punch
  </div>

  <div class="mobile-pad">
    <div class="pad-row">
      <div class="pad-side">
        <div class="dpad" id="p1pad">
          <div class="btn" data-key="up">&#9650;</div>
          <div class="btn" data-key="left">&#9664;</div>
          <div class="btn" data-key="down">&#9660;</div>
          <div class="btn" data-key="right">&#9654;</div>
        </div>
        <button class="action-btn p1-action" data-key="punch">PUNCH</button>
      </div>
      <div class="pad-side">
        <div class="dpad" id="p2pad">
          <div class="btn" data-key="up">&#9650;</div>
          <div class="btn" data-key="left">&#9664;</div>
          <div class="btn" data-key="down">&#9660;</div>
          <div class="btn" data-key="right">&#9654;</div>
        </div>
        <button class="action-btn p2-action" data-key="punch">PUNCH</button>
      </div>
    </div>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reset Match</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const GRAVITY = 0.55;
  const FRICTION = 0.88;
  const ROUND_TIME = 60;

  let p1, p2, timer = ROUND_TIME, gameState = 'playing', timerInt = null;
  const keys = {};
  const touch = { p1:{}, p2:{} };

  function resize(){
    const w = canvas.parentElement.clientWidth;
    canvas.width = w;
    canvas.height = Math.min(w * 0.52, 420);
  }
  resize();
  window.addEventListener('resize', resize);

  // Keyboard
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // Touch / Mouse bindings
  function bindPad(containerId, player){
    const container = document.getElementById(containerId);
    const btns = container.querySelectorAll('[data-key]');
    btns.forEach(btn => {
      const key = btn.dataset.key;
      const down = () => { touch[player][key] = true; btn.classList.add('pressed'); };
      const up = () => { touch[player][key] = false; btn.classList.remove('pressed'); };
      btn.addEventListener('touchstart', e => { e.preventDefault(); down(); });
      btn.addEventListener('touchend', e => { e.preventDefault(); up(); });
      btn.addEventListener('mousedown', down);
      btn.addEventListener('mouseup', up);
      btn.addEventListener('mouseleave', up);
    });
  }
  bindPad('p1pad', 'p1');
  bindPad('p2pad', 'p2');
  // Bind action buttons separately since they're outside dpad
  document.querySelectorAll('.action-btn').forEach(btn => {
    const player = btn.classList.contains('p1-action') ? 'p1' : 'p2';
    const key = btn.dataset.key;
    const down = () => { touch[player][key] = true; btn.classList.add('pressed'); };
    const up = () => { touch[player][key] = false; btn.classList.remove('pressed'); };
    btn.addEventListener('touchstart', e => { e.preventDefault(); down(); });
    btn.addEventListener('touchend', e => { e.preventDefault(); up(); });
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
  });

  function pressed(pl, key){
    if(pl==='p1'){
      if(key==='left')  return keys['KeyA']||touch.p1.left;
      if(key==='right') return keys['KeyD']||touch.p1.right;
      if(key==='up')    return keys['KeyW']||touch.p1.up;
      if(key==='down')  return keys['KeyS']||touch.p1.down;
      if(key==='punch') return keys['Space']||touch.p1.punch;
    } else {
      if(key==='left')  return keys['ArrowLeft']||touch.p2.left;
      if(key==='right') return keys['ArrowRight']||touch.p2.right;
      if(key==='up')    return keys['ArrowUp']||touch.p2.up;
      if(key==='down')  return keys['ArrowDown']||touch.p2.down;
      if(key==='punch') return keys['Enter']||touch.p2.punch;
    }
    return false;
  }

  class Boxer {
    constructor(x, color, facing, player){
      this.x = x; this.y = 0; this.vx = 0; this.vy = 0;
      this.w = 48; this.h = 88;
      this.color = color;
      this.facing = facing;
      this.player = player;
      this.hp = 100; this.maxHp = 100;
      this.punching = false; this.punchT = 0; this.punchCD = 0;
      this.blocking = false; this.ducking = false;
      this.flash = 0; this.ko = false; this.koT = 0;
      this.walk = 0;
    }
    update(other){
      if(this.ko){ this.koT--; if(this.koT<=0){ this.ko=false; this.y=0; this.vy=0; } return; }
      const ground = canvas.height - this.h - 18;
      const L = pressed(this.player,'left'), R = pressed(this.player,'right');
      const U = pressed(this.player,'up'), D = pressed(this.player,'down'), P = pressed(this.player,'punch');

      if(L && !R) this.vx -= 1.1;
      if(R && !L) this.vx += 1.1;
      if(U && this.y >= ground-2) this.vy = -13;
      this.ducking = D && this.y >= ground-2;
      this.blocking = U && this.y >= ground-2 && Math.abs(this.vx)<0.6;

      if(P && this.punchCD<=0 && !this.blocking){
        this.punching = true; this.punchT = 10; this.punchCD = 28;
      }
      if(this.punchT>0) this.punchT--; else this.punching = false;
      if(this.punchCD>0) this.punchCD--;

      this.vx *= FRICTION;
      this.vy += GRAVITY;
      this.x += this.vx; this.y += this.vy;
      if(this.y > ground){ this.y = ground; this.vy = 0; }
      if(this.x < 18){ this.x = 18; this.vx = 0; }
      if(this.x > canvas.width - this.w - 18){ this.x = canvas.width - this.w - 18; this.vx = 0; }

      // Push apart
      const dx = other.x - this.x, dist = Math.abs(dx), minD = this.w + 12;
      if(dist < minD && Math.abs(this.y - other.y) < 55){
        const ov = (minD - dist)/2;
        if(dx>0){ this.x -= ov; other.x += ov; } else { this.x += ov; other.x -= ov; }
      }
      if(this.flash>0) this.flash--;
      if(Math.abs(this.vx)>0.4 && this.y>=ground-2) this.walk += 0.25;
    }
    getPunchBox(){
      const ext = this.punching ? 32 : 0;
      return { x: this.x + this.w/2 + this.facing*(this.w/2 + 22 + ext), y: this.y + this.h/2 - 8, r: 20 };
    }
    getBodyBox(){
      const duckOff = this.ducking ? 22 : 0;
      return { x: this.x + this.w/2, y: this.y + this.h/2 + duckOff/2, w: this.w, h: this.h - duckOff };
    }
    draw(){
      const ground = canvas.height - this.h - 18;
      const duckOff = this.ducking ? 22 : 0;
      const by = this.y + duckOff, bh = this.h - duckOff;
      ctx.save();
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(this.x+this.w/2, ground+this.h+6, 28, 7, 0, 0, Math.PI*2); ctx.fill();

      if(this.ko){
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y+45, bh, this.w-18);
        ctx.fillStyle = '#ffdbac';
        ctx.beginPath(); ctx.arc(this.x+14, this.y+58, 13, 0, Math.PI*2); ctx.fill();
        ctx.restore(); return;
      }
      if(this.flash>0) ctx.globalAlpha = 0.5 + Math.sin(this.flash*0.6)*0.5;

      const sway = Math.sin(this.walk)*3;
      // Torso
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x+sway, by+22, this.w, bh-22);
      // Shorts
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(this.x-2+sway, by+bh-28, this.w+4, 28);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x-2+sway, by+bh-28, this.w+4, 4);
      // Belt
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(this.x+sway, by+bh-32, this.w, 5);

      // Head
      const hx = this.x + this.w/2 + sway, hy = by + 14;
      ctx.fillStyle = '#ffdbac';
      ctx.beginPath(); ctx.arc(hx, hy, 15, 0, Math.PI*2); ctx.fill();
      // Hair
      ctx.fillStyle = '#3d2b1f';
      ctx.beginPath(); ctx.arc(hx, hy-3, 15, Math.PI, 0); ctx.fill();
      // Eyes
      ctx.fillStyle = '#1a1a1a';
      const ed = this.facing;
      ctx.beginPath(); ctx.arc(hx+ed*5, hy-2, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+ed*5, hy+4, 2.5, 0, Math.PI*2); ctx.fill();

      if(this.blocking){
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x-6+sway, by+8, 12, 12);
        ctx.fillRect(this.x+this.w-6+sway, by+8, 12, 12);
        ctx.fillStyle = '#c0392b';
        ctx.beginPath(); ctx.arc(this.x+sway, by+14, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x+this.w+sway, by+14, 8, 0, Math.PI*2); ctx.fill();
      } else {
        const ext = this.punching ? 30 : 0;
        const gx = this.x + this.w/2 + this.facing*(18+ext) + sway;
        const gy = by + 28;
        // Back glove
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x+this.w/2-this.facing*14+sway-5, by+26, 12, 12);
        ctx.fillStyle = '#c0392b';
        ctx.beginPath(); ctx.arc(this.x+this.w/2-this.facing*14+sway, by+32, 8, 0, Math.PI*2); ctx.fill();
        // Front glove
        ctx.fillStyle = this.color;
        ctx.fillRect(gx-5, gy-5, 12, 12);
        ctx.fillStyle = '#c0392b';
        ctx.beginPath(); ctx.arc(gx, gy, 10, 0, Math.PI*2); ctx.fill();
        if(this.punching && ext>8){
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(gx, gy, 16+Math.random()*5, 0, Math.PI*2); ctx.stroke();
        }
      }
      ctx.restore();
    }
    damage(amt){
      if(this.blocking) amt *= 0.25;
      if(this.ducking) amt *= 0.5;
      this.hp -= amt; this.flash = 12;
      if(this.hp<=0){ this.hp=0; this.ko=true; this.koT=100; this.vy=-7; }
    }
  }

  function init(){
    p1 = new Boxer(100, '#e74c3c', 1, 'p1');
    p2 = new Boxer(canvas.width-148, '#3498db', -1, 'p2');
    timer = ROUND_TIME; gameState = 'playing';
    document.getElementById('status').textContent = '';
    updateUI();
    if(timerInt) clearInterval(timerInt);
    timerInt = setInterval(()=>{
      if(gameState==='playing'){
        timer--; if(timer<=0){ timer=0; endGame('time'); }
        updateUI();
      }
    },1000);
  }

  function updateUI(){
    document.getElementById('timer').textContent = timer;
    document.getElementById('p1hp').textContent = Math.ceil(p1.hp)+'%';
    document.getElementById('p2hp').textContent = Math.ceil(p2.hp)+'%';
    document.getElementById('p1bar').style.width = p1.hp+'%';
    document.getElementById('p2bar').style.width = p2.hp+'%';
    const c1 = p1.hp>50?'#3fb950':p1.hp>25?'#d29922':'#f85149';
    const c2 = p2.hp>50?'#3fb950':p2.hp>25?'#d29922':'#f85149';
    document.getElementById('p1bar').style.background = c1;
    document.getElementById('p2bar').style.background = c2;
  }

  function endGame(reason){
    gameState = reason;
    const s = document.getElementById('status');
    if(reason==='ko'){
      s.textContent = p1.hp<=0 ? 'Player 2 wins by KO!' : 'Player 1 wins by KO!';
      s.style.color = '#f0883e';
    } else {
      if(p1.hp>p2.hp) s.textContent = 'Player 1 wins on points!';
      else if(p2.hp>p1.hp) s.textContent = 'Player 2 wins on points!';
      else s.textContent = 'Draw!';
      s.style.color = '#8b949e';
    }
    if(timerInt) clearInterval(timerInt);
  }

  function checkHit(a, d){
    if(!a.punching || a.punchT!==5) return;
    const p = a.getPunchBox(), b = d.getBodyBox();
    const dx = p.x - b.x, dy = p.y - b.y;
    if(Math.sqrt(dx*dx+dy*dy) < p.r + b.w/2){
      d.damage(9);
      d.vx += a.facing * 3.5;
      updateUI();
      if(d.hp<=0) endGame('ko');
    }
  }

  function drawRing(){
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, h-18, w, 18);
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
    for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.moveTo(0,h-18-i*32); ctx.lineTo(w,h-18-i*32); ctx.stroke(); }
    ctx.fillStyle = '#8e44ad'; ctx.fillRect(4, h-130, 9, 112); ctx.fillRect(w-13, h-130, 9, 112);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(0, h-18, 14, 14);
    ctx.fillStyle = '#2980b9'; ctx.fillRect(w-14, h-18, 14, 14);
  }

  function loop(){
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#1a1a2e'); g.addColorStop(0.5,'#16213e'); g.addColorStop(1,'#0f3460');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    drawRing();

    if(gameState==='playing'){
      p1.update(p2); p2.update(p1);
      checkHit(p1,p2); checkHit(p2,p1);
    }
    if(p1.y < p2.y){ p1.draw(); p2.draw(); } else { p2.draw(); p1.draw(); }

    requestAnimationFrame(loop);
  }

  document.getElementById('resetBtn').addEventListener('click', init);
  init();
  loop();
})();
</script>
</body>
</html>
