<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🥊 1v1 Boxing · 100 Levels</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      padding: 12px;
    }
    .game-wrapper {
      background: #1e3b4f;
      padding: 18px 18px 24px;
      border-radius: 56px 56px 32px 32px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.08);
      max-width: 500px;
      width: 100%;
      transition: all 0.2s;
    }
    .canvas-container {
      background: #0f212f;
      border-radius: 40px 40px 24px 24px;
      padding: 10px;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.5);
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 400 / 480;
      background: radial-gradient(circle at 20% 30%, #3a6b85, #1d3e52);
      border-radius: 32px;
      box-shadow: 0 0 0 2px #3f6b80, 0 0 0 4px #1c3342;
      touch-action: none;
      cursor: pointer;
      margin: 0 auto;
    }
    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 12px 6px 12px;
      color: #edf4f7;
      text-shadow: 0 2px 3px #0a141e;
      font-weight: 600;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    .level-box {
      background: #132a38;
      padding: 8px 20px;
      border-radius: 60px;
      box-shadow: inset 0 3px 6px #0b1c26, 0 4px 6px rgba(0,0,0,0.5);
      font-size: 1.4rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-box span {
      background: #f5c542;
      color: #1d2f3b;
      padding: 0 14px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 1.9rem;
      line-height: 1.4;
      min-width: 48px;
      text-align: center;
      box-shadow: inset 0 -2px 0 #a07d2c;
    }
    .status-badge {
      background: #1e3d4e;
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 2px 5px #0e202b;
      border-bottom: 2px solid #3b6a7a;
    }
    .status-badge .emoji {
      font-size: 1.7rem;
      line-height: 1;
    }
    .reset-btn {
      background: #b13e3e;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 8px 20px;
      border-radius: 40px;
      box-shadow: 0 6px 0 #681f1f, 0 4px 12px black;
      transition: 0.08s linear;
      touch-action: manipulation;
      cursor: pointer;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #d97a7a;
    }
    .reset-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #681f1f;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 12px;
      padding: 0 6px;
    }
    .punch-btn {
      background: #d93f3f;
      border: none;
      border-radius: 80px;
      padding: 14px 30px;
      font-weight: 800;
      font-size: 1.5rem;
      color: white;
      text-shadow: 0 2px 0 #691f1f;
      box-shadow: 0 9px 0 #6f2424, 0 6px 16px rgba(0,0,0,0.5);
      transition: 0.06s linear;
      touch-action: manipulation;
      cursor: pointer;
      flex: 1;
      max-width: 180px;
      border: 1px solid #f06a6a;
      letter-spacing: 2px;
    }
    .punch-btn:active {
      transform: translateY(7px);
      box-shadow: 0 2px 0 #6f2424;
    }
    .punch-btn:disabled {
      opacity: 0.6;
      transform: translateY(5px);
      box-shadow: 0 4px 0 #6f2424;
      pointer-events: none;
    }
    .footer-note {
      text-align: center;
      color: #7b9eb0;
      font-size: 0.75rem;
      margin-top: 14px;
      letter-spacing: 0.3px;
      opacity: 0.8;
    }
    @media (max-width: 460px) {
      .game-wrapper { padding: 10px; }
      .level-box { font-size: 1.1rem; padding: 4px 14px; }
      .level-box span { font-size: 1.6rem; min-width: 40px; }
      .status-badge { font-size: 1rem; padding: 4px 12px; }
      .punch-btn { font-size: 1.3rem; padding: 16px 12px; }
      .reset-btn { font-size: 0.9rem; padding: 6px 14px; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="canvas-container">
    <canvas id="boxingCanvas" width="400" height="480"></canvas>
  </div>

  <div class="info-panel">
    <div class="level-box">
      🥊 <span id="levelDisplay">1</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="emoji">👊</span> <span id="statusText">Ready</span>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ Reset</button>
  </div>

  <div class="controls">
    <button class="punch-btn" id="punchBtn">👊 PUNCH</button>
  </div>
  <div class="footer-note">▼ tap punch or press SPACE · 1v1 · 100 levels</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('boxingCanvas');
    const ctx = canvas.getContext('2d');
    const levelSpan = document.getElementById('levelDisplay');
    const statusText = document.getElementById('statusText');
    const statusEmoji = document.querySelector('.status-badge .emoji');
    const punchBtn = document.getElementById('punchBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ----- GAME STATE (1v1) -----
    const state = {
      level: 1,
      // ----- PLAYER (left) -----
      player: {
        x: 120,
        y: 240,
        radius: 32,
        // punch state
        isPunching: false,
        punchTimer: 0,
        punchCooldown: 0,
        hitCount: 0,          // hits landed on opponent (need 3 to level up)
        isHitStun: false,     // got hit by opponent
        hitStunTimer: 0,
      },
      // ----- OPPONENT (right) -----
      opponent: {
        x: 270,
        y: 220,
        radius: 38,
        speed: 1.8,
        direction: 1,         // 1 = down, -1 = up
        isPunching: false,    // opponent punch animation
        punchTimer: 0,
        isHitStun: false,
        hitStunTimer: 0,
      },
      // ----- global -----
      gameOver: false,
      win: false,
      animFrame: null,
    };

    // ----- CONSTANTS -----
    const MAX_LEVEL = 100;
    const BASE_SPEED = 1.8;
    const PUNCH_DURATION = 12;
    const PUNCH_COOLDOWN_MAX = 18;
    const HIT_STUN_MAX = 18;        // frames stunned after hit

    // ----- HELPERS -----
    function getLevelSpeed(level) {
      return Math.min(BASE_SPEED + (level - 1) * 0.28, 7.0);
    }

    function getOpponentRadius(level) {
      return Math.min(38 + Math.floor(level / 20), 46);
    }

    // ----- RESET MATCH (keep level) -----
    function resetMatch() {
      const p = state.player;
      const o = state.opponent;
      p.y = 240;
      p.isPunching = false;
      p.punchTimer = 0;
      p.punchCooldown = 0;
      p.hitCount = 0;
      p.isHitStun = false;
      p.hitStunTimer = 0;

      o.y = 220;
      o.direction = 1;
      o.isPunching = false;
      o.punchTimer = 0;
      o.isHitStun = false;
      o.hitStunTimer = 0;
      o.speed = getLevelSpeed(state.level);
      o.radius = getOpponentRadius(state.level);

      state.gameOver = false;
      state.win = false;
      punchBtn.disabled = false;
      updateStatusText('Fight!', '🥊');
      levelSpan.textContent = state.level;
    }

    // ----- NEXT LEVEL -----
    function goToNextLevel() {
      if (state.level >= MAX_LEVEL) {
        state.gameOver = true;
        state.win = true;
        updateStatusText('🏆 CHAMPION!', '🏆');
        punchBtn.disabled = true;
        return;
      }
      state.level += 1;
      const o = state.opponent;
      o.speed = getLevelSpeed(state.level);
      o.radius = getOpponentRadius(state.level);
      resetMatch();
      levelSpan.textContent = state.level;
      updateStatusText(`Level ${state.level}`, '⚡');
    }

    // ----- PLAYER PUNCH -----
    function performPunch() {
      const p = state.player;
      if (state.gameOver) return;
      if (p.isPunching) return;
      if (p.punchCooldown > 0) return;
      if (p.isHitStun) return;

      // initiate punch
      p.isPunching = true;
      p.punchTimer = PUNCH_DURATION;
      p.punchCooldown = PUNCH_COOLDOWN_MAX;
      punchBtn.disabled = true;

      // collision check vs opponent
      const o = state.opponent;
      const dx = o.x - p.x;
      const dy = o.y - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const threshold = p.radius + o.radius - 6;

      if (dist < threshold && !o.isHitStun) {
        // HIT LANDED!
        p.hitCount++;
        o.isHitStun = true;
        o.hitStunTimer = HIT_STUN_MAX;
        // push opponent
        o.y += 18 * o.direction;

        updateStatusText(`👊 Hit ${p.hitCount}/3`, '💥');

        if (p.hitCount >= 3) {
          goToNextLevel();
          return;
        }
        // increase opponent speed slightly on hit
        o.speed = Math.min(o.speed + 0.25, 7.5);
      } else {
        // MISS
        updateStatusText('Miss!', '😤');
        // if opponent not in hitstun, they may counter-punch? (AI will handle)
      }
    }

    // ----- OPPONENT AI (1v1) -----
    function updateOpponentAI() {
      const o = state.opponent;
      const p = state.player;
      if (state.gameOver) return;
      if (o.isHitStun) return;

      // movement: seek player's y with some randomness
      const targetY = p.y + (Math.random() - 0.5) * 40;
      const diff = targetY - o.y;
      const moveSpeed = o.speed * 0.7;

      if (Math.abs(diff) > 15) {
        o.y += Math.sign(diff) * Math.min(Math.abs(diff) * 0.12, moveSpeed);
      } else {
        // random drift
        o.y += (Math.random() - 0.5) * 0.8;
      }

      // boundaries
      o.y = Math.max(70, Math.min(400, o.y));

      // opponent punch AI: randomly punch if close enough and not punching
      if (!o.isPunching && !p.isHitStun) {
        const dx = o.x - p.x;
        const dy = o.y - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const threshold = o.radius + p.radius + 10;

        // punch chance increases with level and proximity
        const punchChance = Math.min(0.018 + (state.level * 0.0015), 0.09);
        if (dist < threshold && Math.random() < punchChance) {
          // opponent punches!
          o.isPunching = true;
          o.punchTimer = PUNCH_DURATION;

          // check if it hits player
          if (dist < o.radius + p.radius - 4 && !p.isHitStun) {
            // opponent lands a hit!
            p.isHitStun = true;
            p.hitStunTimer = HIT_STUN_MAX;
            updateStatusText('💀 Ouch!', '💢');
            // if player gets hit, reset hit count? (punishment)
            p.hitCount = Math.max(0, p.hitCount - 1);
            if (p.hitCount < 0) p.hitCount = 0;
            // push player
            p.y += 15 * (p.y < o.y ? -1 : 1);
            // if player gets hit too many times? we'll make it a loss if hit while already low
            // but we want 1v1 feel: 3 hits to win, but if opponent lands 3 hits you lose?
            // we track a "health" concept: each hit reduces player's progress
            // we'll use a simple: if opponent hits you 3 times (total) you lose.
            // we'll track opponentHits
            if (!state.opponentHits) state.opponentHits = 0;
            state.opponentHits = (state.opponentHits || 0) + 1;
            if (state.opponentHits >= 3) {
              state.gameOver = true;
              state.win = false;
              updateStatusText('💀 KO!', '💀');
              punchBtn.disabled = true;
            }
          }
        }
      }

      // opponent punch timer
      if (o.isPunching) {
        o.punchTimer--;
        if (o.punchTimer <= 0) {
          o.isPunching = false;
        }
      }
    }

    // ----- UPDATE LOOP -----
    function updateGame() {
      if (state.gameOver) return;

      const p = state.player;
      const o = state.opponent;

      // player cooldowns
      if (p.punchCooldown > 0) {
        p.punchCooldown--;
        if (p.punchCooldown === 0) {
          if (!p.isPunching) punchBtn.disabled = false;
        }
      }
      if (p.isPunching) {
        p.punchTimer--;
        if (p.punchTimer <= 0) {
          p.isPunching = false;
          if (p.punchCooldown === 0) punchBtn.disabled = false;
        }
      }
      if (p.isHitStun) {
        p.hitStunTimer--;
        if (p.hitStunTimer <= 0) p.isHitStun = false;
      }

      // opponent stun
      if (o.isHitStun) {
        o.hitStunTimer--;
        if (o.hitStunTimer <= 0) {
          o.isHitStun = false;
        }
      }

      // opponent AI
      updateOpponentAI();

      // boundary for player (optional)
      p.y = Math.max(70, Math.min(400, p.y));
    }

    // ----- DRAWING (1v1) -----
    function draw() {
      ctx.clearRect(0, 0, 400, 480);

      const p = state.player;
      const o = state.opponent;

      // ---- shadows ----
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 14;

      // ---- PLAYER (left) ----
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
      ctx.fillStyle = '#2d7eb0';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.strokeStyle = '#b4d9f0';
      ctx.lineWidth = 3;
      ctx.stroke();

      // player face
      ctx.beginPath();
      ctx.arc(p.x-8, p.y-6, 6, 0, Math.PI*2);
      ctx.fillStyle = '#f5e6d3';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x+8, p.y-6, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#1f1f2e';
      ctx.beginPath();
      ctx.arc(p.x-10, p.y-10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x+6, p.y-10, 3, 0, Math.PI*2);
      ctx.fill();

      // player punch effect
      if (p.isPunching) {
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(p.x + 40, p.y - 2, 18, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255, 220, 80, 0.6)';
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 180, 40, 0.8)';
        ctx.beginPath();
        ctx.arc(p.x + 48, p.y - 4, 12, 0, Math.PI*2);
        ctx.fill();
      }

      // ---- OPPONENT (right) ----
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.radius, 0, Math.PI*2);
      ctx.fillStyle = '#b83b3b';
      ctx.fill();
      ctx.strokeStyle = '#e07a7a';
      ctx.lineWidth = 3;
      ctx.stroke();

      // opponent face
      ctx.beginPath();
      ctx.arc(o.x-8, o.y-6, 7, 0, Math.PI*2);
      ctx.fillStyle = '#d9b8a0';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(o.x+8, o.y-6, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#1f1f2e';
      ctx.beginPath();
      ctx.arc(o.x-10, o.y-10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(o.x+6, o.y-10, 3, 0, Math.PI*2);
      ctx.fill();

      // opponent punch effect
      if (o.isPunching) {
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(o.x - 40, o.y - 2, 18, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255, 100, 70, 0.6)';
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 80, 40, 0.8)';
        ctx.beginPath();
        ctx.arc(o.x - 48, o.y - 4, 12, 0, Math.PI*2);
        ctx.fill();
      }

      // hit stun indicators
      if (p.isHitStun) {
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius+6, 0, Math.PI*2);
        ctx.strokeStyle = '#ff6644';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
      if (o.isHitStun) {
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.radius+6, 0, Math.PI*2);
        ctx.strokeStyle = '#ffdd44';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // ---- UI on canvas ----
      ctx.shadowBlur = 10;
      ctx.font = 'bold 17px monospace';
      ctx.fillStyle = '#dbeef5';
      ctx.textAlign = 'left';
      ctx.fillText(`Lv.${state.level}`, 14, 38);
      ctx.fillStyle = '#b3d6e0';
      const hits = state.player.hitCount;
      ctx.fillText(`👊 ${hits}/3`, 14, 66);
      // opponent hits
      const oppHits = state.opponentHits || 0;
      ctx.textAlign = 'right';
      ctx.fillStyle = '#f5b0b0';
      ctx.fillText(`💢 ${oppHits}/3`, 386, 66);

      // game over
      if (state.gameOver) {
        ctx.shadowBlur = 20;
        ctx.font = 'bold 38px "Segoe UI", system-ui';
        ctx.fillStyle = state.win ? '#f5d742' : '#e05858';
        ctx.shadowColor = 'black';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.win ? '🏆 WINNER' : '💀 LOST', 200, 80);
        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = '#ebf5f0';
        ctx.fillText(state.win ? 'Champion!' : 'Press Reset', 200, 140);
      }

      ctx.shadowBlur = 0;
    }

    // ----- GAME LOOP -----
    function gameLoop() {
      updateGame();
      draw();
      state.animFrame = requestAnimationFrame(gameLoop);
    }

    // ----- FULL RESET -----
    function fullReset() {
      state.level = 1;
      state.opponentHits = 0;
      const o = state.opponent;
      o.speed = getLevelSpeed(1);
      o.radius = getOpponentRadius(1);
      resetMatch();
      levelSpan.textContent = 1;
      updateStatusText('Reset', '🔄');
      punchBtn.disabled = false;
      state.gameOver = false;
      state.win = false;
      state.opponentHits = 0;
    }

    // ----- UI UPDATE -----
    function updateStatusText(text, emoji) {
      statusText.textContent = text;
      statusEmoji.textContent = emoji || '👊';
    }

    // ----- EVENT LISTENERS -----
    punchBtn.addEventListener('click', (e) => {
      e.preventDefault();
      performPunch();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        performPunch();
      }
    });

    resetBtn.addEventListener('click', (e) => {
      e.preventDefault();
      fullReset();
    });

    canvas.addEventListener('click', (e) => {
      e.preventDefault();
      performPunch();
    });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      performPunch();
    }, { passive: false });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ----- INIT -----
    function init() {
      state.opponentHits = 0;
      state.opponent.speed = getLevelSpeed(1);
      state.opponent.radius = getOpponentRadius(1);
      resetMatch();
      levelSpan.textContent = 1;
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      gameLoop();
    }

    init();
  })();
</script>
</body>
</html>
